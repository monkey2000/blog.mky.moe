<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="zbaxrl 的技术博客。" />
    <title>zbaxrl's blog</title>
    <link
      id="github-theme-light"
      href="/styles/github-markdown-light.css"
      media="(prefers-color-scheme: light)"
      rel="stylesheet"
    />
    <link
      id="github-theme-dark"
      href="/styles/github-markdown-dark.css"
      media="(prefers-color-scheme: dark)"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("blog-theme");
          if (mode !== "light" && mode !== "dark") return;

          document.documentElement.dataset.theme = mode;
          document.getElementById("github-theme-light").media = mode === "light" ? "all" : "not all";
          document.getElementById("github-theme-dark").media = mode === "dark" ? "all" : "not all";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
